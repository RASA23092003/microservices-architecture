spring:
  application:
    name: EPharmacy_PaymentMS
  datasource:
    url: jdbc:mysql://mysql:3306/EPharmacy_PaymentMS_DB?useSSL=false&createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        
        enabled: true
        register: true
        service-name: ${spring.application.name}
        prefer-ip-address: true
  kafka:
    producer:
      bootstrap-servers: kafka:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        
server:
  port: 6400
  servlet:
    context-path: /epharmacy