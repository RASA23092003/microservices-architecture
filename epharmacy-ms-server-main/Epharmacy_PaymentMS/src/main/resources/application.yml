spring:
  application:
    name: EPharmacy_PaymentMS
  datasource:
    url: jdbc:mysql://localhost:3306/EPharmacy_PaymentMS_DB?useSSL=false
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    consul:
      discovery:
        hostname: localhost
        enabled: true
        register: true
        service-name: ${spring.application.name}
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        
server:
  port: 6400
  servlet:
    context-path: /epharmacy