spring:
  application:
    name: EPharmacy_PaymentMS
  datasource:
    url: jdbc:mysql://localhost:3306/EPharmacy_PaymentMS_DB?useSSL=false
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    consul:
      discovery:
        hostname: localhost
        enabled: true
        register: true
        service-name: ${spring.application.name}
server:
  port: 6400
  servlet:
    context-path: /epharmacy