spring:
  application:
    name: EPharmacy-CartMS
  datasource:
    url: jdbc:mysql://localhost:3306/EPHARMACY_CARTMS_DB?useSSL=false
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    consul:
      discovery:
        hostname: localhost
        enabled: true
        register: true
        service-name: ${spring.application.name}
      
server:
  port: 6300
  servlet:
    context-path: /epharmacy