services:

  consul:
    image: hashicorp/consul
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0

  mysql:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  kafka:
  image: apache/kafka:3.7.0
  container_name: kafka
  ports:
    - "9092:9092"
  environment:
    - KAFKA_NODE_ID=1
    - KAFKA_PROCESS_ROLES=broker,controller
    - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
    - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
    - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

  customer-ms:
    build: ./customer-ms
    container_name: customer-ms
    ports:
      - "6100:6100"
    depends_on:
      - mysql
      - consul
      # - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/EPHARMACY_CUSTOMERMS_DB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      # SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  
  payment-ms:
    build: ./payment-ms
    container_name: payment-ms
    ports:
      - "6400:6400"
    depends_on:
      - mysql
      - consul
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/EPharmacy_PaymentMS_DB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  
  message-ms:
    build: ./message-ms
    container_name: message-ms
    ports:
      - "6600:6600"
    depends_on:
      - consul
      - kafka
    environment:
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092