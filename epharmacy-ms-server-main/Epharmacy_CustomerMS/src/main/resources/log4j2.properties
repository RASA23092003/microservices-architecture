# =====================================================
# Log4j2 Configuration
# =====================================================

name=LoggerConfigFile


# ================= ROOT LOGGER =================

rootLogger.level=INFO
rootLogger.appenderRefs=console,file
rootLogger.appenderRef.console.ref=ConsoleAppender
rootLogger.appenderRef.file.ref=LoggerAppender


# ================= APPLICATION LOGGER =================

logger.application.name=com.infy
logger.application.level=DEBUG
logger.application.additivity=false
logger.application.appenderRefs=console,file
logger.application.appenderRef.console.ref=ConsoleAppender
logger.application.appenderRef.file.ref=LoggerAppender


# ================= SPRING SECURITY DEBUG =================

logger.security.name=org.springframework.security
logger.security.level=DEBUG
logger.security.additivity=false
logger.security.appenderRef.console.ref=ConsoleAppender


# ================= HIBERNATE DEBUG =================

logger.hibernate.name=org.hibernate
logger.hibernate.level=INFO
logger.hibernate.additivity=false
logger.hibernate.appenderRef.console.ref=ConsoleAppender


# ================= FILE APPENDER =================

appender.file.name=LoggerAppender
appender.file.type=File
appender.file.fileName=logs/application.log
appender.file.append=true

appender.file.layout.type=PatternLayout
appender.file.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n%throwable


# ================= CONSOLE APPENDER =================

appender.console.name=ConsoleAppender
appender.console.type=Console

appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n%throwable


# ================= ASYNC LOGGER (OPTIONAL) =================

# Uncomment if you want async logging
# appender.file.type=RollingFile