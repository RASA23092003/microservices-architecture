# Name of the Properties file
name=LoggerConfigFile

# ================= ROOT LOGGER =================
rootLogger.level=INFO
rootLogger.appenderRef.console.ref=ConsoleAppender
rootLogger.appenderRef.file.ref=LoggerAppender

# ================= BUSINESS LOGGERS =================

# Business logic (only errors)
logger.file.name=com.infy.utility
logger.file.level=ERROR
logger.file.appenderRef.file.ref=LoggerAppender
logger.file.additivity=false

# General application logs (console)
logger.console.name=com.infy
logger.console.level=INFO
logger.console.appenderRef.console.ref=ConsoleAppender
logger.console.additivity=false

# ================= FILE APPENDER =================
appender.file.name=LoggerAppender
appender.file.type=File
appender.file.fileName=logs/error.log

appender.file.layout.type=PatternLayout
appender.file.layout.pattern=%d{yyyy-MMM-dd HH:mm:ss a} [%t] %-5level %logger{36} - %msg%n

# ================= CONSOLE APPENDER =================
appender.console.name=ConsoleAppender
appender.console.type=Console

appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{yyyy-MMM-dd HH:mm:ss a} [%t] %-5level %logger{36} - %msg%n